# Workflow fixture only: two sample rows reuse examples/demo.
# Paths resolve relative to this YAML file, not the current directory.
# These miniature HMMs are not production databases.
databases:
  pfam: ../demo/db/pfam_mini.hmm
  nbd_hmms: ../demo/db/nbd.hmm
  custom_hmms: null
execution:
  cpu_threads: 2
discovery:
  discovery_mode: BROAD
  pfam_nbd_scan: 0
asm:
  asm_enable: 0
fusion:
  enabled: 0
reporting:
  # The handwritten fixture GFF3 has no CDS features to translate.
  write_proteins: 0
